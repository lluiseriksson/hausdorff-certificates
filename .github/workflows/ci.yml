name: ci

on:
  push:
  pull_request:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Unit tests (including slow zeta smoke)
        run: pytest -q
      - name: Regenerate artifacts deterministically
        run: python scripts/generate_artifacts.py --out artifacts_ci
      - name: Determinism gate (byte-level diff against committed artifacts)
        run: diff -ru artifacts artifacts_ci
      - name: Independent verification of every certificate
        run: python -m hausdorff_certificates.verify artifacts_ci/*.cert.json
      - name: Upload artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: hausdorff-certificates-artifacts
          path: artifacts_ci/
